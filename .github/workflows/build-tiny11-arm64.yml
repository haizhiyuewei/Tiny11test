name: Build tiny11 ARM64 ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows 11 ARM64 ISO
        run: |
          Invoke-WebRequest -Uri "https://software.download.prss.microsoft.com/dbazure/Windows11_Client_arm64_zh-cn_26300_9457.iso?t=796869d7-ac79-4580-b157-13b36e054002&P1=1790935396&P2=602&P3=2&P4=FbpV9Scn1IPz50hA6ceQTl2q7U5dv1TAQbprTwzzkTXk%2fW1RHY2fSQaXM0KKBioFJrkr0Zv27F3LY1zUvAkNDoWB3jJcQ4D1lBw%2fpUIMxxz5q1N1f5
          " -OutFile "${{ github.workspace }}\win11-arm64.iso"

      - name: Mount ISO and get drive letter
        id: mount
        run: |
          $mountResult = Mount-DiskImage -ImagePath "${{ github.workspace }}\win11-arm64.iso" -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          echo "ISO_DRIVE=$driveLetter" >> $env:GITHUB_ENV
          Write-Host "ISO mounted at $driveLetter`:"

      - name: Run tiny11 Core Builder Script
        run: |
          .\tiny11AICoremaker.ps1 -ISODrive "$env:ISO_DRIVE" -WorkDrive "$env:SystemDrive" -OutputISO "${{ github.workspace }}\tiny11-arm64.iso" -AssumeYes

      - name: Dismount ISO
        if: always()
        run: |
          Dismount-DiskImage -ImagePath "${{ github.workspace }}\win11-arm64.iso" -ErrorAction SilentlyContinue

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-arm64-iso
          path: ${{ github.workspace }}\tiny11-arm64.iso
